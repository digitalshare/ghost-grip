[project]
name = "ghost-grip"
version = "0.1.0"
description = "An AI camera-robot crew for horror films: scene text -> grounded shot list -> feasible robot motion -> 3D previz -> call sheet."
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai==1.15.2",
  "crewai-tools[mcp]==1.15.2",
  "mcp~=1.26.0",
  "mcpadapt>=0.1.9,<0.2",
  "python-dotenv",
  "numpy",
  "httpx",
  "openai",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
